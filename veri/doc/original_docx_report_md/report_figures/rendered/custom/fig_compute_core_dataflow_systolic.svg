<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5E35B1"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#C62828"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#EF6C00"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #263238; letter-spacing: 0; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #546E7A; }
      .label { font-size: 24px; font-weight: 700; }
      .mid { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; font-weight: 600; }
      .note { font-size: 16px; fill: #546E7A; }
      .panel { fill: #FFFFFF; stroke: #CFD8DC; stroke-width: 2; rx: 8; }
      .arrayPanel { fill: #FFF5F5; stroke: #C62828; stroke-width: 3; rx: 8; }
      .pe { fill: #FFFDF7; stroke: #455A64; stroke-width: 1.8; rx: 4; }
      .peAlt { fill: #FFF3E0; stroke: #455A64; stroke-width: 1.8; rx: 4; }
      .iaBox { fill: #E3F2FD; stroke: #1565C0; stroke-width: 3; rx: 8; }
      .biasBox { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 3; rx: 8; }
      .psBox { fill: #EDE7F6; stroke: #5E35B1; stroke-width: 3; rx: 8; }
      .weightBox { fill: #FFF8E1; stroke: #EF6C00; stroke-width: 3; rx: 8; }
      .outBox { fill: #FFEBEE; stroke: #C62828; stroke-width: 3; rx: 8; }
      .iaPoly { fill: #E3F2FD; stroke: #1565C0; stroke-width: 3; }
      .biasPoly { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 3; }
      .psPoly { fill: #EDE7F6; stroke: #5E35B1; stroke-width: 3; }
      .outPoly { fill: #FFEBEE; stroke: #C62828; stroke-width: 3; }
      .iaLine { stroke: #1565C0; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .biasLine { stroke: #2E7D32; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
      .psLine { stroke: #5E35B1; stroke-width: 4; fill: none; marker-end: url(#arrowPurple); }
      .outLine { stroke: #C62828; stroke-width: 4; fill: none; marker-end: url(#arrowRed); }
      .wLine { stroke: #EF6C00; stroke-width: 3.5; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 10 8; }
      .blueText { fill: #1565C0; }
      .greenText { fill: #2E7D32; }
      .purpleText { fill: #5E35B1; }
      .redText { fill: #C62828; }
      .orangeText { fill: #EF6C00; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="800" y="46" text-anchor="middle" class="title">compute_core 阶梯化输入、正交阵列传播与反对角化输出</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">左侧 IA 平行四边形输入；阵列内 IA 水平传播、bias/部分和垂直传播；底部错拍输出进入反对角化</text>

  <!-- Left input side -->
  <rect x="52" y="132" width="328" height="606" class="panel"/>
  <rect x="92" y="158" width="248" height="74" class="iaBox"/>
  <text x="216" y="189" text-anchor="middle" class="label">输入缓存</text>
  <text x="216" y="216" text-anchor="middle" class="mid">IA cache</text>
  <text x="216" y="270" text-anchor="middle" class="label blueText">IA 从左侧输入</text>
  <text x="216" y="298" text-anchor="middle" class="note">相邻行输入错开一个时钟</text>

  <polygon points="112,342 258,342 294,384 148,384" class="iaPoly"/>
  <polygon points="132,412 278,412 314,454 168,454" class="iaPoly"/>
  <polygon points="152,482 298,482 334,524 188,524" class="iaPoly"/>
  <polygon points="172,552 318,552 354,594 208,594" class="iaPoly"/>
  <text x="203" y="370" text-anchor="middle" class="mid">a0 @ T0</text>
  <text x="223" y="440" text-anchor="middle" class="mid">a1 @ T1</text>
  <text x="243" y="510" text-anchor="middle" class="mid">a2 @ T2</text>
  <text x="263" y="580" text-anchor="middle" class="mid">a3 @ T3</text>
  <text x="216" y="646" text-anchor="middle" class="note">平行四边形表示阶梯化数据带</text>

  <!-- Top inputs -->
  <rect x="470" y="116" width="610" height="126" class="panel"/>
  <text x="775" y="150" text-anchor="middle" class="label">顶部输入选择</text>
  <polygon points="520,178 682,178 710,214 548,214" class="biasPoly"/>
  <text x="615" y="202" text-anchor="middle" class="mid">bias / zero</text>
  <polygon points="818,178 980,178 1008,214 846,214" class="psPoly"/>
  <text x="913" y="202" text-anchor="middle" class="mid">部分和回灌</text>
  <text x="775" y="234" text-anchor="middle" class="note">首个 K 分块使用 bias 或 0；后续 K 分块使用部分和作为初值</text>

  <rect x="1130" y="142" width="246" height="82" class="weightBox"/>
  <text x="1253" y="176" text-anchor="middle" class="mid">权重数据</text>
  <text x="1253" y="204" text-anchor="middle" class="mid">装入后驻留在 PE</text>

  <!-- Systolic array -->
  <rect x="470" y="278" width="620" height="404" class="arrayPanel"/>
  <text x="780" y="314" text-anchor="middle" class="label">SIZE x SIZE 权重固定脉动阵列</text>
  <text x="780" y="342" text-anchor="middle" class="mid">正交传播：IA 向右，bias/部分和向下</text>

  <g transform="translate(548,374)">
    <!-- Orthogonal flow guides behind PE labels -->
    <path d="M-72 28 H504" class="iaLine" opacity="0.78"/>
    <path d="M-52 96 H504" class="iaLine" opacity="0.78"/>
    <path d="M-32 164 H504" class="iaLine" opacity="0.78"/>
    <path d="M-12 232 H504" class="iaLine" opacity="0.78"/>

    <path d="M52 -58 V272" class="psLine" opacity="0.76"/>
    <path d="M164 -58 V272" class="psLine" opacity="0.76"/>
    <path d="M276 -58 V272" class="psLine" opacity="0.76"/>
    <path d="M388 -58 V272" class="psLine" opacity="0.76"/>

    <!-- PE grid -->
    <rect x="0" y="0" width="112" height="68" class="peAlt"/><text x="56" y="43" text-anchor="middle" class="small">PE00</text>
    <rect x="112" y="0" width="112" height="68" class="pe"/><text x="168" y="43" text-anchor="middle" class="small">PE01</text>
    <rect x="224" y="0" width="112" height="68" class="peAlt"/><text x="280" y="43" text-anchor="middle" class="small">PE02</text>
    <rect x="336" y="0" width="112" height="68" class="pe"/><text x="392" y="43" text-anchor="middle" class="small">PE03</text>

    <rect x="0" y="68" width="112" height="68" class="pe"/><text x="56" y="111" text-anchor="middle" class="small">PE10</text>
    <rect x="112" y="68" width="112" height="68" class="peAlt"/><text x="168" y="111" text-anchor="middle" class="small">PE11</text>
    <rect x="224" y="68" width="112" height="68" class="pe"/><text x="280" y="111" text-anchor="middle" class="small">PE12</text>
    <rect x="336" y="68" width="112" height="68" class="peAlt"/><text x="392" y="111" text-anchor="middle" class="small">PE13</text>

    <rect x="0" y="136" width="112" height="68" class="peAlt"/><text x="56" y="179" text-anchor="middle" class="small">PE20</text>
    <rect x="112" y="136" width="112" height="68" class="pe"/><text x="168" y="179" text-anchor="middle" class="small">PE21</text>
    <rect x="224" y="136" width="112" height="68" class="peAlt"/><text x="280" y="179" text-anchor="middle" class="small">PE22</text>
    <rect x="336" y="136" width="112" height="68" class="pe"/><text x="392" y="179" text-anchor="middle" class="small">PE23</text>

    <rect x="0" y="204" width="112" height="68" class="pe"/><text x="56" y="247" text-anchor="middle" class="small">PE30</text>
    <rect x="112" y="204" width="112" height="68" class="peAlt"/><text x="168" y="247" text-anchor="middle" class="small">PE31</text>
    <rect x="224" y="204" width="112" height="68" class="pe"/><text x="280" y="247" text-anchor="middle" class="small">PE32</text>
    <rect x="336" y="204" width="112" height="68" class="peAlt"/><text x="392" y="247" text-anchor="middle" class="small">PE33</text>

    <!-- Visible orthogonal flow guides above the PE cells -->
    <path d="M-72 24 H504" class="iaLine" opacity="0.72"/>
    <path d="M-52 92 H504" class="iaLine" opacity="0.72"/>
    <path d="M-32 160 H504" class="iaLine" opacity="0.72"/>
    <path d="M-12 228 H504" class="iaLine" opacity="0.72"/>

    <path d="M88 -58 V272" class="psLine" opacity="0.70"/>
    <path d="M200 -58 V272" class="psLine" opacity="0.70"/>
    <path d="M312 -58 V272" class="psLine" opacity="0.70"/>
    <path d="M424 -58 V272" class="psLine" opacity="0.70"/>
  </g>

  <!-- Input arrows to rows -->
  <path d="M294 363 H476" class="iaLine"/>
  <path d="M314 433 H496" class="iaLine"/>
  <path d="M334 503 H516" class="iaLine"/>
  <path d="M354 573 H536" class="iaLine"/>

  <!-- Top input arrows to columns -->
  <path d="M615 214 V316 H600 V374" class="biasLine"/>
  <path d="M615 214 V316 H712 V374" class="biasLine"/>
  <path d="M913 214 V316 H824 V374" class="psLine"/>
  <path d="M913 214 V316 H936 V374" class="psLine"/>
  <path d="M1253 224 V252 H1030 V374" class="wLine"/>
  <text x="1048" y="360" text-anchor="start" class="small orangeText">W 驻留</text>

  <!-- Bottom skewed output -->
  <text x="780" y="720" text-anchor="middle" class="label redText">阵列下方错拍输出</text>
  <path d="M600 646 V744" class="outLine"/>
  <path d="M712 646 V744" class="outLine"/>
  <path d="M824 646 V744" class="outLine"/>
  <path d="M936 646 V744" class="outLine"/>
  <polygon points="544,744 692,744 724,782 576,782" class="outPoly"/>
  <polygon points="656,744 804,744 836,782 688,782" class="outPoly"/>
  <polygon points="768,744 916,744 948,782 800,782" class="outPoly"/>
  <polygon points="880,744 1028,744 1060,782 912,782" class="outPoly"/>
  <text x="633" y="769" text-anchor="middle" class="mid">p0</text>
  <text x="745" y="769" text-anchor="middle" class="mid">p1</text>
  <text x="857" y="769" text-anchor="middle" class="mid">p2</text>
  <text x="969" y="769" text-anchor="middle" class="mid">p3</text>

  <!-- Partial sum buffer and feedback -->
  <rect x="1150" y="312" width="300" height="142" class="psBox"/>
  <text x="1300" y="354" text-anchor="middle" class="label">部分和缓冲区</text>
  <text x="1300" y="386" text-anchor="middle" class="mid">保存中间 K 分块</text>
  <text x="1300" y="416" text-anchor="middle" class="mid">下一 K 分块回灌到顶部</text>
  <path d="M1090 612 H1122 V454 H1150" class="psLine dash"/>
  <path d="M1300 312 V252 H913" class="psLine dash"/>

  <!-- De-diagonalizer and final output -->
  <rect x="1138" y="704" width="278" height="112" class="iaBox"/>
  <text x="1277" y="746" text-anchor="middle" class="label">反对角化</text>
  <text x="1277" y="778" text-anchor="middle" class="mid">错拍数据对齐为向量</text>
  <path d="M1060 763 H1138" class="outLine"/>

  <rect x="1452" y="714" width="108" height="92" class="biasBox"/>
  <text x="1506" y="748" text-anchor="middle" class="mid">acc_data</text>
  <text x="1506" y="776" text-anchor="middle" class="mid">y0 y1</text>
  <text x="1506" y="802" text-anchor="middle" class="mid">y2 y3</text>
  <path d="M1416 760 H1452" class="iaLine"/>
  <text x="1320" y="842" text-anchor="middle" class="note">最终 K 分块输出送入 vec_requant</text>

  <!-- Legend -->
  <rect x="52" y="766" width="408" height="106" class="panel"/>
  <line x1="82" y1="800" x2="142" y2="800" class="iaLine"/><text x="162" y="808" class="mid">IA 水平传播</text>
  <line x1="82" y1="834" x2="142" y2="834" class="psLine"/><text x="162" y="842" class="mid">bias/部分和垂直传播与回灌</text>
  <line x1="82" y1="864" x2="142" y2="864" class="outLine"/><text x="162" y="872" class="mid">阵列底部输出</text>
</svg>
