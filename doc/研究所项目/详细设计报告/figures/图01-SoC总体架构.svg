<text x="260.0" y="120.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">本地程序与数据 BRAM</text>
<text x="260.0" y="159.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">LMB · 512 KiB</text>
<text x="800.0" y="120.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">MicroBlaze V</text>
<text x="800.0" y="159.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">RISC-V 控制处理器</text>
<text x="1355.0" y="120.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">DSA NPU</text>
<text x="1355.0" y="159.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">16×16 · INT32 累加</text>
<text x="800.0" y="453.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="36">AXI Interconnect</text>
<text x="800.0" y="496.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="33">2 个主设备输入 · 16 个从设备输出</text>
<text x="265.0" y="791.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">传感器与显示外设</text>
<text x="265.0" y="830.0" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">I²C / SPI / GPIO</text>
<text x="265.0" y="868.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">UART / 定时器 / 中断</text>
<text x="800.0" y="791.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">AXI BRAM 控制器</text>
<text x="800.0" y="830.0" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">单控制器 · 32 位</text>
<text x="800.0" y="868.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">CPU / NPU 共享访问</text>
<text x="1315.0" y="791.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">共享 URAM / BRAM</text>
<text x="1315.0" y="830.0" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">模型常量与运行张量</text>
<text x="1315.0" y="868.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">统一逻辑地址</text>
<text x="265.0" y="1055.0" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">实际传感器 / OLED</text>
<text x="530" y="102" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="28">LMB</text>
<text x="675" y="310" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="28">AXI 主访问</text>
<text x="1140" y="310" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="28">AXI-Lite</text>
<text x="1500" y="310" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="26">AXI4 DMA</text>
<text x="390" y="645" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="28">外设访问</text>
<text x="930" y="645" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="28">共享存储访问</text>
<text x="1050" y="790" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="26">RAM</text>
<text x="990" y="1040" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">推理主通路共同使用 125 MHz 时钟</text>
</svg>
