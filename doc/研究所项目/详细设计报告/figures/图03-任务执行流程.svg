<text x="200.0" y="119.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">软件提交任务</text>
<text x="200.0" y="160.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">地址 / 尺寸 / 参数</text>
<text x="600.0" y="119.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">配置锁存与检查</text>
<text x="600.0" y="160.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">清除旧状态</text>
<text x="1000.0" y="119.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">加载与分块计算</text>
<text x="1000.0" y="160.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">缓存 / 阵列 / 部分和</text>
<text x="1400.0" y="119.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">缩放与结果打包</text>
<text x="1400.0" y="160.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">类型与激活限幅</text>
<text x="1400.0" y="449.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">发出输出写事务</text>
<text x="1400.0" y="490.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">数据 / 字节使能</text>
<text x="1000.0" y="449.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">等待全部写响应</text>
<text x="1000.0" y="490.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">在途事务计数归零</text>
<text x="600.0" y="449.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">置位完成状态</text>
<text x="600.0" y="490.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">done / error</text>
<text x="200.0" y="449.6" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="34">CPU 使用输出</text>
<text x="200.0" y="490.4" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="31">进入后续算子或应用</text>
</svg>
