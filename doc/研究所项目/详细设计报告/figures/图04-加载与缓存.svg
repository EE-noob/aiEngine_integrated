<text x="750.0" y="80.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">DMA 读引擎与仲裁</text>
<text x="750.0" y="119.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">共享存储 → 各读取客户端</text>
<text x="265.0" y="400.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">输入激活加载</text>
<text x="265.0" y="439.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">行步长 / INT8 或 INT16</text>
<text x="750.0" y="400.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">权重加载</text>
<text x="750.0" y="439.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">按输出通道取连续权重</text>
<text x="1235.0" y="400.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">偏置与缩放参数读取</text>
<text x="1235.0" y="439.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">INT32 偏置 / 通道参数</text>
<text x="265.0" y="710.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">输入激活缓存</text>
<text x="265.0" y="749.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">分块复用 / 发送次序</text>
<text x="750.0" y="710.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">权重缓存</text>
<text x="750.0" y="749.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">装入 / 驻留 / 复用</text>
<text x="1235.0" y="710.8" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="32">通道参数寄存器</text>
<text x="1235.0" y="749.2" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="29">偏置 / 乘数 / 移位</text>
<text x="750" y="860" text-anchor="middle" dominant-baseline="central" fill="#191919" font-family="Noto Sans CJK SC" font-weight="700" font-size="30">有效数据、通道编号与当前分块一致</text>
</svg>
